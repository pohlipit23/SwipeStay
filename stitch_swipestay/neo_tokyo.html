<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Digital Sky Raleway Variant</title>
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300;400;500;600;700;800;900&amp;display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet"
        />
        <script>
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        colors: {
                            azure: {
                                50: "#f0f9ff",
                                100: "#e0f2fe",
                                200: "#bae6fd",
                                300: "#7dd3fc",
                                400: "#38bdf8",
                                500: "#0ea5e9",
                                600: "#0284c7",
                                700: "#0369a1",
                                800: "#075985",
                                900: "#0c4a6e",
                            },
                            cyan: {
                                400: "#22d3ee",
                                500: "#06b6d4",
                            },
                            slate: {
                                800: "#1e293b",
                                900: "#0f172a",
                            },
                        },
                        fontFamily: {
                            sans: ['"Raleway"', "sans-serif"],
                            display: ['"Raleway"', "sans-serif"],
                        },
                        borderRadius: {
                            DEFAULT: "0.5rem",
                            xl: "1rem",
                            "2xl": "1.5rem",
                            "3xl": "2rem",
                            "4xl": "2.5rem",
                        },
                        boxShadow: {
                            glass: "0 8px 32px 0 rgba(31, 38, 135, 0.07)",
                            neon: "0 0 10px rgba(34, 211, 238, 0.5), inset 0 0 5px rgba(34, 211, 238, 0.2)",
                            "neon-hover":
                                "0 0 20px rgba(34, 211, 238, 0.8), inset 0 0 10px rgba(34, 211, 238, 0.4)",
                            float: "0 20px 40px -10px rgba(0,0,0,0.2)",
                        },
                        backgroundImage: {
                            "grid-pattern":
                                "linear-gradient(to right, rgba(14, 165, 233, 0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(14, 165, 233, 0.05) 1px, transparent 1px)",
                            "digital-map":
                                "repeating-linear-gradient(45deg, #0ea5e9 0, #0ea5e9 1px, transparent 0, transparent 50%), repeating-linear-gradient(-45deg, #0ea5e9 0, #0ea5e9 1px, transparent 0, transparent 50%)",
                        },
                    },
                },
            };
        </script>
        <style>
            .no-scrollbar::-webkit-scrollbar {
                display: none;
            }
            .no-scrollbar {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
            .glass-panel {
                background: rgba(255, 255, 255, 0.1);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                border: 1px solid rgba(255, 255, 255, 0.2);
                box-shadow:
                    0 4px 6px -1px rgba(0, 0, 0, 0.1),
                    0 2px 4px -1px rgba(0, 0, 0, 0.06);
            }
            .neon-border {
                box-shadow: 0 0 15px rgba(34, 211, 238, 0.3);
                border: 1px solid rgba(34, 211, 238, 0.6);
            }
            .text-glow {
                text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            }
            .grid-bg {
                background-size: 40px 40px;
            }
            .map-3d {
                background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M10 10h80v80H10z' fill='none' stroke='%2338bdf8' stroke-width='0.5' stroke-opacity='0.2'/%3E%3Cpath d='M20 20l10 10h40l10-10' fill='none' stroke='%230ea5e9' stroke-width='1'/%3E%3Crect x='35' y='40' width='10' height='20' fill='%230ea5e9' fill-opacity='0.2'/%3E%3Crect x='55' y='35' width='15' height='25' fill='%230ea5e9' fill-opacity='0.3'/%3E%3C/svg%3E");
            }
        </style>
        <style>
            body {
                min-height: max(884px, 100dvh);
            }
        </style>
        <style>
            body {
                min-height: max(884px, 100dvh);
            }
        </style>
        <style>
            body {
                min-height: max(884px, 100dvh);
            }
        </style>
    </head>
    <body
        class="bg-gradient-to-b from-white to-azure-100 bg-grid-pattern grid-bg text-slate-800 font-sans h-screen flex flex-col overflow-hidden selection:bg-cyan-200 selection:text-cyan-900"
    >
        <header class="flex justify-between items-center px-6 py-5 z-10">
            <div class="flex flex-col">
                <span
                    class="text-azure-900 font-sans font-extrabold text-2xl leading-none tracking-tight"
                    >Digital Sky</span
                >
                <span
                    class="text-cyan-600 text-[10px] tracking-[0.25em] uppercase mt-1 font-medium"
                    >Future Stays</span
                >
            </div>
            <button
                class="bg-white/60 hover:bg-white/90 backdrop-blur-md border border-azure-200 shadow-sm w-10 h-10 rounded-xl flex items-center justify-center transition-all duration-300 group"
            >
                <span
                    class="material-symbols-outlined text-azure-600 group-hover:text-cyan-500 transition-colors"
                    style="font-size: 20px"
                    >tune</span
                >
            </button>
        </header>
        <main
            class="flex-1 px-4 pb-4 flex flex-col relative h-full max-h-[calc(100vh-160px)]"
        >
            <div
                class="relative w-full h-full rounded-[2rem] overflow-hidden neon-border bg-slate-900 group shadow-float"
            >
                <div class="absolute inset-0 z-0">
                    <img
                        alt="Modern futuristic luxury hotel room with city view"
                        class="w-full h-full object-cover transform scale-100 transition-transform duration-[10s] group-hover:scale-105 ease-linear opacity-90"
                        src="https://lh3.googleusercontent.com/aida-public/AB6AXuD0zCzl4WcKitAfk992A-N2RqivpsHrH48eyCRzG2dLKEVdv88I-taWNZImICQ5HIdkT1gpUEASPeibJujm7fIG0QtHOZIUkNgESX0QTYXfk_pGwhr5tgWccZ9CFq3wF8zd4vnXVfgVvD29YkyRZ0zHNIP3yzeAXryTahizhGR--alLYR99nueqH6-gQjo9-sVzmWppmmMUnRrPZqmfed4cGET7oNWstDjrItMwPDj4fAfTGiGYofMyOXErUwqV7qzrsV_PE5Ij5pOY"
                    />
                    <div
                        class="absolute inset-0 bg-gradient-to-b from-transparent via-transparent to-azure-900/90 z-10"
                    ></div>
                    <div
                        class="absolute inset-0 bg-gradient-to-t from-slate-900/80 via-transparent to-transparent z-10"
                    ></div>
                </div>
                <div
                    class="absolute top-6 left-6 right-6 flex justify-between z-20"
                >
                    <div class="flex gap-3">
                        <div
                            class="glass-panel px-4 py-2 rounded-xl border border-cyan-400/30"
                        >
                            <span
                                class="text-white font-sans font-bold text-xs uppercase tracking-widest drop-shadow-sm text-glow"
                                >Verified</span
                            >
                        </div>
                        <div
                            class="bg-azure-500/80 backdrop-blur-md px-3 py-2 rounded-xl flex items-center gap-1.5 border border-white/20 shadow-lg"
                        >
                            <span
                                class="material-symbols-outlined text-white text-sm filled"
                                >star</span
                            >
                            <span
                                class="text-white text-xs font-bold tracking-wide"
                                >5.0</span
                            >
                        </div>
                    </div>
                    <button
                        class="glass-panel w-10 h-10 rounded-xl flex items-center justify-center transition-transform active:scale-95 hover:bg-white/20 border border-white/30"
                    >
                        <span
                            class="material-symbols-outlined text-white text-xl"
                            >favorite</span
                        >
                    </button>
                </div>
                <div
                    class="absolute bottom-0 left-0 right-0 z-20 pb-0 flex flex-col"
                >
                    <div class="px-6 pb-6 space-y-4">
                        <div>
                            <h1
                                class="text-white font-sans text-5xl font-extrabold tracking-tight leading-none mb-2 drop-shadow-lg"
                            >
                                Neo Tokyo
                            </h1>
                            <div class="flex items-center gap-2 text-cyan-100">
                                <span
                                    class="material-symbols-outlined text-lg text-cyan-400"
                                    >location_on</span
                                >
                                <span
                                    class="font-sans font-light text-sm tracking-wide"
                                    >Shibuya District, Tokyo</span
                                >
                            </div>
                        </div>
                        <div class="flex items-end justify-between gap-4">
                            <div class="flex gap-2">
                                <div
                                    class="glass-panel px-3 py-2 rounded-lg flex flex-col items-center justify-center min-w-[60px]"
                                >
                                    <span
                                        class="material-symbols-outlined text-cyan-300 text-lg mb-1"
                                        >wifi</span
                                    >
                                    <span
                                        class="text-[9px] text-white uppercase tracking-wider font-light"
                                        >5G Ultra</span
                                    >
                                </div>
                                <div
                                    class="glass-panel px-3 py-2 rounded-lg flex flex-col items-center justify-center min-w-[60px]"
                                >
                                    <span
                                        class="material-symbols-outlined text-cyan-300 text-lg mb-1"
                                        >thermostat</span
                                    >
                                    <span
                                        class="text-[9px] text-white uppercase tracking-wider font-light"
                                        >Smart</span
                                    >
                                </div>
                            </div>
                            <div
                                class="glass-panel px-6 py-4 rounded-xl flex flex-col items-end shadow-xl border border-cyan-500/20 bg-azure-900/40"
                            >
                                <span
                                    class="text-[10px] text-cyan-200 uppercase tracking-widest mb-1 font-bold"
                                    >Per Night</span
                                >
                                <div class="flex items-baseline gap-1">
                                    <span
                                        class="font-sans text-3xl text-white font-bold tracking-tighter"
                                        >$850</span
                                    >
                                </div>
                            </div>
                        </div>
                    </div>
                    <div
                        class="relative w-full h-20 bg-slate-900 mt-2 rounded-t-[2rem] overflow-hidden cursor-pointer flex flex-col items-center pt-3 border-t border-cyan-500/30 map-3d group-hover:h-24 transition-all duration-300"
                    >
                        <div
                            class="absolute inset-0 bg-gradient-to-b from-azure-900/20 to-slate-900/90 pointer-events-none"
                        ></div>
                        <div
                            class="w-16 h-1 bg-cyan-500/40 rounded-full mb-2 z-10 shadow-[0_0_10px_rgba(6,182,212,0.5)]"
                        ></div>
                        <div class="flex items-center gap-2 z-10 mt-0.5">
                            <span
                                class="material-symbols-outlined text-cyan-400 text-sm animate-pulse"
                                >explore</span
                            >
                            <span
                                class="text-[10px] font-bold tracking-[0.2em] text-cyan-400 uppercase drop-shadow-[0_0_5px_rgba(34,211,238,0.8)]"
                                >View 3D Map</span
                            >
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <nav
            class="px-8 py-6 pb-10 flex justify-center items-center gap-10 md:gap-20 z-10"
        >
            <div class="flex flex-col items-center gap-3 group cursor-pointer">
                <button
                    class="w-14 h-14 rounded-full border-2 border-slate-300 bg-white/50 backdrop-blur-sm flex items-center justify-center text-slate-400 hover:text-cyan-500 hover:border-cyan-400 hover:shadow-neon hover:bg-white transition-all duration-300 active:scale-95"
                >
                    <span class="material-symbols-outlined text-3xl"
                        >close</span
                    >
                </button>
            </div>
            <div
                class="flex flex-col items-center gap-3 group cursor-pointer scale-110"
            >
                <button
                    class="w-16 h-16 rounded-full border-2 border-azure-500 bg-azure-50/50 backdrop-blur-md flex items-center justify-center text-azure-600 hover:text-cyan-500 hover:border-cyan-400 hover:shadow-neon-hover hover:bg-white transition-all duration-300 active:scale-95 relative overflow-hidden"
                >
                    <div
                        class="absolute inset-0 bg-gradient-to-tr from-cyan-400/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"
                    ></div>
                    <span class="material-symbols-outlined text-3xl"
                        >rocket_launch</span
                    >
                </button>
            </div>
            <div class="flex flex-col items-center gap-3 group cursor-pointer">
                <button
                    class="w-14 h-14 rounded-full border-2 border-slate-300 bg-white/50 backdrop-blur-sm flex items-center justify-center text-slate-400 hover:text-cyan-500 hover:border-cyan-400 hover:shadow-neon hover:bg-white transition-all duration-300 active:scale-95"
                >
                    <span class="material-symbols-outlined text-3xl"
                        >bookmark_border</span
                    >
                </button>
            </div>
        </nav>
    </body>
</html>
